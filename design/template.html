<script>
  // Paged.js: χωρίς αυτόματο preview ώστε να ξεκινά αφού φορτώσουν οι γραμματοσειρές
  window.PagedConfig = { auto: false };
  (function () {
    var sources = [
      "assets/vendor/paged.polyfill.js",   // τοπικό αντίγραφο (make assets) — πρώτη επιλογή
      "https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js",
      "https://cdn.jsdelivr.net/npm/pagedjs@0.4.3/dist/paged.polyfill.js",
      "https://cdnjs.cloudflare.com/ajax/libs/pagedjs/0.4.3/paged.polyfill.min.js"
    ];
    var i = 0;
    function run() {
      // σήμα για το make-pdf: data-paged="done" μόλις τελειώσει η σελιδοποίηση, "error" αν αποτύχει
      var mark = function (v) { document.documentElement.setAttribute("data-paged", v); };
      var go = function () {
        try {
          Promise.resolve(window.PagedPolyfill.preview()).then(function () { mark("done"); },
            function (e) { console.error("Paged.js:", e); mark("error"); });
        } catch (e) { console.error("Paged.js:", e); mark("error"); }
      };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
    }
    function load() {
      if (i >= sources.length) { console.error("Paged.js δεν φορτώθηκε από καμία πηγή"); return; }
      var s = document.createElement("script");
      s.src = sources[i++];
      s.onload = function () {
        if (document.readyState === "complete") run();
        else window.addEventListener("load", run);
      };
      s.onerror = load;
      document.head.appendChild(s);
    }
    load();
  })();
</script>
