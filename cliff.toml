# git-cliff: https://git-cliff.org — Conventional Commits -> CHANGELOG.md
[changelog]
header = """
# Ιστορικό εκδόσεων

Τι άλλαξε στον οδηγό σε κάθε έκδοση. Οι αλλαγές στον κώδικα και στο build δεν γράφονται εδώ. Θα τις βρεις στο git history του repo.\n
"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} · {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Επόμενη έκδοση{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {{ commit.message | upper_first }}{% if commit.breaking %} (**BREAKING**){% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# στο «Ιστορικό εκδόσεων» μπαίνουν μόνο όσα βλέπει ο αναγνώστης (feat/fix)
commit_parsers = [
  { message = "^(feat|chore)\\(assets\\)", group = "<!-- 2 -->Φωτογραφίες" },
  { message = "^feat", group = "<!-- 0 -->Νέα και αλλαγές" },
  { message = "^fix", group = "<!-- 1 -->Διορθώσεις" },
  { message = "^(docs|build|perf|refactor|chore|ci|test|style)", skip = true },
]
