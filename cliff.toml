# git-cliff: https://git-cliff.org — Conventional Commits -> CHANGELOG.md
[changelog]
header = """
# Changelog

Όλες οι αξιοσημείωτες αλλαγές του οδηγού. Μορφή: [Keep a Changelog](https://keepachangelog.com/el/1.1.0/),
εκδόσεις: [Semantic Versioning](https://semver.org/lang/el/).\n
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] – {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**BREAKING**){% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat\\(assets\\)", group = "<!-- 5 -->Φωτογραφίες και assets" },
  { message = "^chore\\(assets\\)", group = "<!-- 5 -->Φωτογραφίες και assets" },
  { message = "^feat", group = "<!-- 0 -->Περιεχόμενο και λειτουργίες" },
  { message = "^fix", group = "<!-- 1 -->Διορθώσεις" },
  { message = "^docs", group = "<!-- 2 -->Τεκμηρίωση" },
  { message = "^build", group = "<!-- 3 -->Build" },
  { message = "^perf", group = "<!-- 4 -->Επιδόσεις" },
  { message = "^refactor", group = "<!-- 6 -->Αναδιάρθρωση" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Συντήρηση" },
]
